<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Rychen Jones</title>
    <meta
      name="description"
      content="Contact Rychen Jones, a software engineering student open to internships."
    />
    <meta name="theme-color" content="#04060C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link href="/src/styles/style.css" rel="stylesheet" />
    <link href="/src/styles/contact.css" rel="stylesheet" />
    <script src="/src/js/background.js" defer></script>
    <script src="/src/js/contact.js" defer></script>
  </head>

  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-mail" viewBox="0 0 24 24">
        <path d="M3 6h18v12H3zM3 7l9 7 9-7" />
      </symbol>
      <symbol id="i-linkedin" viewBox="0 0 24 24">
        <path
          d="M4 4h16v16H4zM8 10v6M8 7.5v.01M12 16v-6M12 12.5c0-1.5 1-2.5 2.5-2.5S17 11 17 12.5V16"
        />
      </symbol>
      <symbol id="i-github" viewBox="0 0 24 24">
        <path
          d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
        />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M17 7L7 17M8 7h9v9" />
      </symbol>
    </svg>

    <div class="page">
      <!-- Animated background: soft drifting colour blobs -->
      <div class="blobs" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
      </div>

      <header class="nav">
        <a class="brand" href="/">Rychen Jones</a>
        <nav aria-label="Primary">
          <a href="/pages/projects.html">Projects</a>
          <a href="/pages/about.html">About</a>
          <a href="/pages/contact.html" aria-current="page">Contact</a>
        </nav>
      </header>

      <main class="contact">
        <section class="contact-intro">
          <h1>Let's talk.</h1>
        </section>

        <section class="contact-methods" aria-label="Ways to contact me">
          <ul>
            <!-- Email -->
            <li class="c-item">
              <a class="c-row" href="mailto:rychen.p.jones@gmail.com">
                <span class="c-tile"
                  ><svg aria-hidden="true"><use href="#i-mail" /></svg>
                </span>
                <span class="c-text">
                  <strong>Email</strong>
                  <small>rychen.p.jones@gmail.com</small>
                </span>
                <svg class="c-go" aria-hidden="true"><use href="#i-arrow" /></svg>
              </a>
              <button
                class="c-action"
                type="button"
                id="copy-email"
                data-email="rychen.p.jones@gmail.com"
              >
                Copy
              </button>
            </li>

            <!-- LinkedIn -->
            <li class="c-item">
              <a
                class="c-row"
                href="https://www.linkedin.com/in/rychenjones"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="c-tile"
                  ><svg aria-hidden="true"><use href="#i-linkedin" /></svg>
                </span>
                <span class="c-text">
                  <strong>LinkedIn</strong>
                  <small>linkedin.com/in/rychenjones</small>
                </span>
                <svg class="c-go" aria-hidden="true"><use href="#i-arrow" /></svg>
              </a>
            </li>

            <!-- GitHub -->
            <li class="c-item">
              <a
                class="c-row"
                href="https://github.com/rychenjones"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="c-tile"
                  ><svg aria-hidden="true"><use href="#i-github" /></svg>
                </span>
                <span class="c-text">
                  <strong>GitHub</strong>
                  <small>github.com/rychenjones</small>
                </span>
                <svg class="c-go" aria-hidden="true"><use href="#i-arrow" /></svg>
              </a>
            </li>
          </ul>
          <p class="c-status" id="c-status" role="status" aria-live="polite"></p>
        </section>
      </main>
    </div>
  </body>
</html>
